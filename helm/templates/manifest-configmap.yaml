apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gitlab-token-updater.fullname" . }}-manifest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitlab-token-updater.labels" . | nindent 4 }}
data:
  config.yml: |
{{ .Values.manifest.config | indent 4 }}
{{- with .Values.manifest.selfRotation }}
{{ . | indent 10 }}
{{- end }}
