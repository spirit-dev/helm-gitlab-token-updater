apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gitlab-token-updater.fullname" . }}-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitlab-token-updater.labels" . | nindent 4 }}
data:
  vault-put.sh: |
{{ .Files.Get "scripts/vault-put.sh" | indent 4 }}
  gitlab-instance-var-put.sh: |
{{ .Files.Get "scripts/gitlab-instance-var-put.sh" | indent 4 }}
